name = "mythix-hub"
main = "src/worker.js"
compatibility_date = "2026-11-26"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mythix-hub"
database_id = "21ad938e-a2d5-4ee8-a173-e34bc0eef9e2"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LIKE_MONITOR"
class_name = "LikeMonitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LikeMonitor"]
